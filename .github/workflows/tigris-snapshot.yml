# Tigris Bucket Status Workflow
#
# NOTE: Native snapshots are NOT supported by Tigris/Fly CLI.
# The `fly storage snapshots` command does not exist.
# See: https://fly.io/docs/flyctl/storage/
#
# For backup strategies, consider:
# - Enable object versioning on the bucket
# - Use rclone to sync to another bucket
# - Use aws s3 sync for periodic backups
#
# This workflow now just reports bucket status.
#
# Required secrets:
#   FLY_API_TOKEN: Your Fly.io API token

name: Tigris Bucket Status

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  status:
    name: Check Tigris Bucket Status
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract bucket name from fly.toml
        id: bucket
        run: |
          BUCKET_NAME=$(grep 'STORAGE_S3_BUCKET' fly.toml | sed "s/.*= *['\"]\\([^'\"]*\\)['\"].*/\\1/")
          if [ -z "$BUCKET_NAME" ]; then
            echo "ERROR: Could not find STORAGE_S3_BUCKET in fly.toml"
            exit 1
          fi
          echo "name=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "Bucket: ${BUCKET_NAME}"

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> $GITHUB_PATH

      - name: Check bucket status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Checking Tigris bucket status..."
          fly storage list
          echo ""
          echo "Bucket details:"
          fly storage status "${{ steps.bucket.outputs.name }}" || echo "Could not get bucket status"

      - name: Summary
        run: |
          echo "## Tigris Bucket Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: ${{ steps.bucket.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note**: Native snapshots are not supported by Tigris." >> $GITHUB_STEP_SUMMARY
          echo "> Consider using rclone or aws s3 sync for backups." >> $GITHUB_STEP_SUMMARY
